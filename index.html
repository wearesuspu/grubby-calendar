<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grubby Calendar</title><style>body{margin:0;font:16px Arial;background:#f5f3ee;color:#26252a}header{padding:28px 8vw;background:#cbdcf1}main{padding:50px 8vw}.bar{display:flex;justify-content:space-between;align-items:center}.bar button,form button{padding:10px 14px;border:0;background:#26252a;color:white;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;margin-top:25px}.weekday,.day{padding:12px;border:1px solid #ddd;min-height:75px}.weekday{min-height:auto;font-size:12px}.day.today{background:#fff4bd}.dot{display:flex;justify-content:space-between;gap:4px;background:#26252a;color:white;padding:5px;margin-top:8px;font-size:12px}.remove{border:0;background:transparent;color:white;cursor:pointer}.form{display:flex;gap:10px;margin-top:25px;flex-wrap:wrap}.form input{padding:11px;border:1px solid #aaa}#share{margin-top:20px;padding:12px;background:#f3d36a;border:0;cursor:pointer}</style></head><body><header><h1>Grubby’s Calendar</h1><p>Simple planning for busy days.</p></header><main><div class="bar"><h2 id="month"></h2><div><button id="prev">←</button><button id="today">Today</button><button id="next">→</button></div></div><div class="calendar" id="calendar"></div><form class="form" id="form"><input id="name" required placeholder="Event name"><input id="date" type="date" required><button>Add event +</button></form><button id="share">Copy custom calendar link ↗</button></main><script>const c=document.querySelector("#calendar"),m=document.querySelector("#month"),f=document.querySelector("#form"),n=document.querySelector("#name"),d=document.querySelector("#date");let v=new Date(),ev=JSON.parse(localStorage.getItem("grubby-events")||"[]"),key=x=>x.toISOString().slice(0,10);function remove(i){ev.splice(i,1);localStorage.setItem("grubby-events",JSON.stringify(ev));render()}function render(){let y=v.getFullYear(),mo=v.getMonth();m.textContent=v.toLocaleDateString("en-US",{month:"long",year:"numeric"});c.innerHTML=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="weekday">${x}</div>`).join("");let first=new Date(y,mo,1).getDay(),total=new Date(y,mo+1,0).getDate();for(let i=0;i<42;i++){let num=i-first+1,dt=new Date(y,mo,num),muted=num<1||num>total;if(num<1)num+=new Date(y,mo,0).getDate();if(num>total)num-=total;let list=ev.map((e,i)=>({...e,i})).filter(e=>e.date==key(dt));c.innerHTML+=`<div class="day ${muted?"muted":""} ${key(dt)==key(new Date())?"today":""}"><b>${num}</b>${list.map(e=>`<span class="dot">${e.name}<button class="remove" data-i="${e.i}">×</button></span>`).join("")}</div>`}c.querySelectorAll(".remove").forEach(b=>b.onclick=()=>remove(+b.dataset.i))}f.onsubmit=e=>{e.preventDefault();ev.push({name:n.value,date:d.value});localStorage.setItem("grubby-events",JSON.stringify(ev));f.reset();d.value=key(new Date());render()};prev.onclick=()=>{v.setMonth(v.getMonth()-1);render()};next.onclick=()=>{v.setMonth(v.getMonth()+1);render()};today.onclick=()=>{v=new Date();render()};share.onclick=async()=>{let link=location.href.split("#")[0]+"#events="+encodeURIComponent(JSON.stringify(ev));try{await navigator.clipboard.writeText(link);share.textContent="Link copied!"}catch(e){prompt("Copy this link:",link)}};d.value=key(new Date());render();</script></body></html>
